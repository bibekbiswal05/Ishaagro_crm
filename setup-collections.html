<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IshaAgro CRM Firestore Setup</title>
    <link rel="stylesheet" href="style.css?v=20260518-logo" />
  </head>
  <body>
    <main class="setup-page">
      <section class="setup-card">
        <div class="brand-row setup-brand">
          <img class="brand-logo" src="assets/isha-agro-logo-icon.png" alt="Isha Agro" />
          <div>
            <strong>IshaAgro CRM</strong>
            <small>Sai Sales by Isha Agro</small>
          </div>
        </div>
        <h1>Create Firestore Collections</h1>
        <p>Sign in with a Firebase Auth account first. The user document will be created with the same document ID as the Auth UID.</p>
        <label>
          User Type
          <select id="setupRole">
            <option value="admin">Admin</option>
            <option value="technician">Technician</option>
          </select>
        </label>
        <label>
          Email
          <input id="setupEmail" type="email" value="test@ishaagro.in" />
        </label>
        <label>
          Password
          <input id="setupPassword" type="password" placeholder="Enter Firebase Auth password" />
        </label>
        <button id="createCollectionsBtn" type="button">Create Collections</button>
        <pre id="setupStatus">Ready.</pre>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="setup-collections.js"></script>
  </body>
</html>
